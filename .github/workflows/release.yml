name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync package version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dir --publish never
      - name: Ad-hoc sign macOS app
        run: chmod +x scripts/sign-mac-app.sh && ./scripts/sign-mac-app.sh
      - name: Create ZIP (auto-update) and DMG
        run: |
          APP=$(find release -name "MQTT Explorer Alt.app" -type d | head -1)
          npx electron-builder --mac zip --publish never --prepackaged "$APP"
          npx electron-builder --mac dmg --publish never --prepackaged "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/MQTT-Explorer-Alt-*.dmg
            release/MQTT-Explorer-Alt-*.zip
            release/latest-mac*.yml
            release/*.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync package version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/MQTT-Explorer-Alt-*
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Sync package version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/MQTT-Explorer-Alt-*
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MQTT-Explorer-Alt-*.dmg
            artifacts/MQTT-Explorer-Alt-*.zip
            artifacts/MQTT-Explorer-Alt-*.exe
            artifacts/MQTT-Explorer-Alt-*.AppImage
            artifacts/latest*.yml
            artifacts/*.blockmap
          fail_on_unmatched_files: true
          body_path: .github/RELEASE_BODY.md
